[project]
name = "nfl-field-goal-pressure"
version = "0.1.0"
description = "Python recreation of \"Temporal and Pressure Effects: Evidence from NFL Field Goals\" (Benjamin, 2025), rebuilt on refreshed nflverse play-by-play data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "ruff>=0.16.0",
]
