name: Neon migrate

on:
  push:
    branches:
      - main
    paths:
      - "packages/db/drizzle/**"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Apply pending Neon migrations
        run: bun run --cwd packages/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
