name: OpenAPI sync

on:
  push:
    branches: [main]
    paths:
      - "apps/api/src/**"
  workflow_dispatch:

jobs:
  generate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate OpenAPI spec
        run: bun run --cwd apps/api generate:openapi

      - name: Dispatch spec to docs repo
        env:
          DOCS_REPO_DISPATCH_TOKEN: ${{ secrets.DOCS_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source_sha "${{ github.sha }}" \
            --slurpfile spec apps/api/openapi.json \
            '{event_type: "openapi-sync", client_payload: {source_sha: $source_sha, spec: $spec[0]}}' \
            > /tmp/dispatch-payload.json

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${DOCS_REPO_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/brysonbenjamin/docs-bryson-benjamin/dispatches \
            -d @/tmp/dispatch-payload.json
